# LeaseGuard local development stack in containers.
#
#   pnpm docker:config    validate this file      (infrastructure/scripts/compose.sh config --quiet)
#   pnpm docker:up        build and start          (compose.sh up -d --build)
#   pnpm docker:down      stop and remove          (compose.sh down)
#   bash infrastructure/scripts/compose.sh --profile frontend up -d --build   also serve the built SPA
#
# Supabase is not part of this file. By default the containers use the local Supabase CLI stack
# (`pnpm db:start`) on the host at host.docker.internal:54321. To use a hosted Supabase project, set
# DOCKER_SUPABASE_URL in .env to its https://<ref>.supabase.co URL (with the matching keys in .env).
#
# Configuration comes from the repository-root .env (copy .env.example). Compose reads that file for
# the ${VARIABLE} values below; host names that differ inside containers are overridden here.
# Least privilege, as in backend/src/config/env.ts: the API and the document-processing service get
# only the variables they use. The worker receives the whole .env because its WhatsApp access tokens
# are referenced by name from the database (`secret://env/WHATSAPP_ACCESS_TOKEN…`), so the set of
# variables it needs is not fixed here.
#
# Published ports bind to 127.0.0.1 only. They default to the ports `pnpm dev` uses, so stop one
# before starting the other, or move these with API_HOST_PORT, DOCUMENT_PROCESSING_HOST_PORT and
# FRONTEND_HOST_PORT in .env. Redis is not published: the containers use it on the compose network,
# and the host keeps its own Redis on 6379 for `pnpm dev`.

name: leaseguard

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

x-backend-shared-env: &backend-shared-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
  SUPABASE_STATEMENTS_BUCKET: ${SUPABASE_STATEMENTS_BUCKET:-statements}
  SUPABASE_LEASE_DOCUMENTS_BUCKET: ${SUPABASE_LEASE_DOCUMENTS_BUCKET:-lease-documents}
  REDIS_URL: redis://redis:6379
  QUEUE_PREFIX: ${QUEUE_PREFIX:-leaseguard}
  DOCUMENT_PROCESSING_MAX_FILE_MB: ${DOCUMENT_PROCESSING_MAX_FILE_MB:-20}

services:
  redis:
    image: redis:7.4.12
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  document-processing:
    build:
      context: python-services/document-processing
    image: leaseguard-document-processing:local
    environment:
      DOCUMENT_PROCESSING_TOKEN: ${DOCUMENT_PROCESSING_TOKEN:-}
      DOCUMENT_PROCESSING_MAX_FILE_MB: ${DOCUMENT_PROCESSING_MAX_FILE_MB:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${DOCUMENT_PROCESSING_HOST_PORT:-8000}:8000"
    healthcheck:
      # Liveness only: /health/ready answers 503 until DOCUMENT_PROCESSING_TOKEN is set.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: *backend-build
    image: leaseguard-backend:local
    environment:
      <<: *backend-shared-env
      API_PORT: "3000"
      # The Vite dev server origin from .env plus the containerised frontend (profile "frontend").
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173},http://localhost:${FRONTEND_HOST_PORT:-8080},http://127.0.0.1:${FRONTEND_HOST_PORT:-8080}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(4000) }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    build: *backend-build
    image: leaseguard-backend:local
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-shared-env
      DOCUMENT_PROCESSING_URL: http://document-processing:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      document-processing:
        condition: service_healthy
    # The worker serves no HTTP; the image's API health check does not apply to it.
    healthcheck:
      disable: true
    # Lets in-flight jobs finish: the worker closes its BullMQ workers on SIGTERM.
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Public values compiled into the bundle (never secrets). The browser runs on the host, so it
      # reaches the API and Supabase through their published host ports.
      args:
        VITE_API_URL: http://127.0.0.1:${API_HOST_PORT:-3000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: leaseguard-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
