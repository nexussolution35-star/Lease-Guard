<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply stored Light/Dark and motion choices before first paint; initTheme() and initMotion() in main.tsx re-apply them. -->
    <script>
      (function () {
        try {
          var motion = localStorage.getItem('leaseguard.motion')
          if (motion === 'reduce' || motion === 'full') document.documentElement.dataset.motion = motion
          var theme = localStorage.getItem('leaseguard.theme')
          if (theme !== 'light' && theme !== 'dark') return
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="color-scheme"]').content = theme
        } catch (error) {}
      })()
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0a2e57" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b192a" />
    <title>LeaseGuard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
