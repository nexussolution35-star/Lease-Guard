# LeaseGuard frontend: static single-page application built by Vite (frontend/Dockerfile).
# Installed as /etc/nginx/conf.d/default.conf. nginx runs as the unprivileged `nginx` user, so it
# listens on 8080. TLS terminates in front of this container.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # The app talks to the LeaseGuard API and Supabase on their own origins; headers that would
    # need those origins (such as a Content-Security-Policy) belong to the deployment's edge.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness for container health checks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed file names under /assets, so they never change once published.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing (TanStack Router): unknown paths serve index.html. A missing file with an
    # extension is a real 404, not the app shell.
    location / {
        try_files $uri $uri/ @spa;
    }

    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    location @spa {
        # index.html references the current hashed assets, so it must always be revalidated.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
